# Pipeline única do workshop: RAW -> Bronze -> Silver -> Gold -> Validação.
# Sem cluster declarado: as tarefas rodam em compute SERVERLESS.

resources:
  jobs:
    food_orders_pipeline:
      name: food-orders-pipeline-${bundle.target}
      description: "Pedidos: raw (S3) -> bronze -> silver -> gold, com validação no final."

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: reader_groups
          default: ${var.reader_groups}

      tasks:
        - task_key: ingestion
          notebook_task:
            notebook_path: ../notebooks/01_ingestion.py

        - task_key: bronze
          depends_on: [{ task_key: ingestion }]
          notebook_task:
            notebook_path: ../notebooks/02_bronze.py

        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ../notebooks/03_silver.py

        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../notebooks/04_gold.py

        - task_key: validate
          depends_on: [{ task_key: gold }]
          notebook_task:
            notebook_path: ../notebooks/05_validate.py

      # Diário às 6h. Em dev (mode: development) o agendamento fica pausado.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED

      max_concurrent_runs: 1
      tags:
        projeto: food-intelligence
        ambiente: ${bundle.target}
