# Configuração do aluno · versão SEM AWS (Express setup).
#
# Você só precisa de uma conta Databricks criada pelo cadastro Express
# (login.databricks.com/signup). Não há conta AWS, bucket, role nem VPC para criar.
# No PRD 01, o Claude Code cria DOIS workspaces serverless novos (DEV e PROD) na sua conta.
#
# Quem preenche: o Claude Code, no início do PRD 01. Ele descobre o que der,
# só com leitura (databricks account workspaces list, current-user me, catalogs list,
# warehouses list), mostra a tabela e pede para você confirmar antes de gravar aqui.
# Os PRDs usam estes valores como {{NOME}}. Deixe vazio o que você não souber.
#
# Sem < > nos valores: só o texto.

# Conta Databricks
DATABRICKS_ACCOUNT_ID: ""     # UUID · Account Console → avatar → Account ID
DATABRICKS_ACCOUNT_PROFILE: "" # profile do CLI com login de CONTA (accounts.cloud.databricks.com). Obrigatório para criar os workspaces
REGIAO: ""                    # a mesma do workspace Express (assim todos usam o mesmo metastore)
METASTORE: ""                 # metastore da região (o do workspace Express)

# Workspace Express (criado no cadastro; não mexemos nele)
WS_EXPRESS: ""                # nome do workspace Express (só informativo)

# O que vamos criar no PRD 01
PREFIXO: ""                   # curto, minúsculo, sem espaço e diferente de "food" (ex.: coca, ana, turma1)
WS_DEV: ""                    # {{PREFIXO}}-dev · também o nome do profile do CLI
WS_DEV_URL: ""                # https://dbc-....cloud.databricks.com (aparece quando o workspace fica Running)
WS_PROD: ""                   # {{PREFIXO}}-prod · também o nome do profile do CLI
WS_PROD_URL: ""
WAREHOUSE_ID_DEV: ""          # SQL warehouse serverless do workspace DEV
WAREHOUSE_ID_PROD: ""         # SQL warehouse serverless do workspace PROD
CATALOGO_AUTOMATICO_DEV: ""   # catálogo que a Databricks cria junto com o workspace DEV (NÃO usado)
CATALOGO_AUTOMATICO_PROD: ""  # idem para PROD (NÃO usado)

# Quem é você
USUARIO: ""                   # seu e-mail de login na Databricks
EMAIL_BASE: ""                # e-mail para os usuários fictícios com +alias (ex.: voce@gmail.com → voce+engenheiro@gmail.com)

# Catálogos do projeto (fixos; o PRD 01 cria, um em cada workspace). NUNCA use o catálogo automático (PRD 00, seção 3.1).
CATALOGO_DEV: "food_dev"
CATALOGO_PROD: "food_prod"
